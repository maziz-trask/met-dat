spring:
  application:
    name: met-dat
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:metdat}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:metdat}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:metdat}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: 60MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # behind the platform's HTTPS proxy
  error:
    include-message: never
    include-stacktrace: never

app:
  demo:
    enabled: ${APP_DEMO_ENABLED:true}
  security:
    jwt-secret: ${APP_JWT_SECRET:}
    token-ttl: PT12H
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    type: ${APP_STORAGE_TYPE:filesystem}      # filesystem | database
    path: ${APP_STORAGE_PATH:./data/attachments}
  upload:
    max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:10MB}
    allowed-extensions: ${APP_UPLOAD_ALLOWED_EXTENSIONS:pdf,csv,txt,xlsx,docx,png,jpg,jpeg}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
