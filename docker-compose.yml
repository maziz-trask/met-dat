# Local development / evaluation:  docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metdat}
      POSTGRES_USER: ${POSTGRES_USER:-metdat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metdat} -d ${POSTGRES_DB:-metdat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-metdat}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-metdat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      APP_DEMO_ENABLED: ${APP_DEMO_ENABLED:-true}
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-filesystem}
      APP_STORAGE_PATH: /data/attachments
      APP_UPLOAD_MAX_FILE_SIZE: ${APP_UPLOAD_MAX_FILE_SIZE:-10MB}
    volumes:
      - attachments:/data/attachments
    ports:
      - "8080:8080"

volumes:
  pgdata:
  attachments:
